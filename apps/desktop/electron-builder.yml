appId: com.sbcb.livechatsbcb
productName: LiveChatSBCB
copyright: SBCB
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraMetadata:
  name: livechatsbcb
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
publish:
  provider: generic
  url: https://livechatsbcb-party.livechatsbcb-party.workers.dev/updates
win:
  target: nsis
  icon: build/icon.ico
  artifactName: LiveChatSBCB-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: LiveChatSBCB
