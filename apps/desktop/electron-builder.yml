appId: com.sbcb.livechatsbcb
productName: LiveChatSBCB
copyright: SBCB
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraMetadata:
  name: livechatsbcb
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
publish:
  provider: generic
  url: https://livechatsbcb-party.livechatsbcb-party.workers.dev/updates
win:
  target: nsis
  icon: build/icon.ico
  artifactName: LiveChatSBCB-Setup-${version}.${ext}
mac:
  target:
    # One file for every Mac, Apple chip or Intel: nobody has to know which one they have.
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: src/renderer/src/assets/logo.png
  category: public.app-category.social-networking
  artifactName: LiveChatSBCB-Mac-${version}.${ext}
  # Apple's signature is paid. This one costs nothing and is what a recent Mac asks for at the very least.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  sign: false
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: LiveChatSBCB
