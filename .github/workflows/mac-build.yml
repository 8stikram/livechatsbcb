# Builds the Mac version on a machine GitHub lends, free on a public repository. Only started by a release.
name: Mac build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  build:
    # The same file is checked on a Mac of each kind.
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:mac
        working-directory: apps/desktop
      - name: Start it, and let it update itself
        run: node test/mac-check.mjs
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check-${{ matrix.runner }}
          include-hidden-files: true
          path: apps/desktop/test/.artifacts/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-15'
        with:
          name: mac-release
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/LiveChatSBCB-Mac-*.dmg
            apps/desktop/release/LiveChatSBCB-Mac-*.zip
